# Run the Python statistics/API tests and the React tests + build on Linux and Windows.
# Needs no secrets; runs on every push and pull request.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python (version from app/.python-version)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: app/.python-version
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Python tests
        shell: bash
        run: |
          python -m pip install -r app/requirements.txt
          python -m pytest -q

      - name: Frontend tests and build
        shell: bash
        run: |
          npm --prefix app/frontend ci
          npm --prefix app/frontend run test -- --run
          npm --prefix app/frontend run build

      - name: Committed bundle matches a fresh build
        shell: bash
        run: |
          git status --porcelain app/static
          test -z "$(git status --porcelain app/static)" || { echo "::error::app/static is stale. Run app/manifestme.sh and commit app/static and app/manifest.json."; exit 1; }
