# CONTRACT.yaml - the task ledger for this Six Sigma Hackathon project.
# SPEC.md says what the tool IS. This file says what is being DONE.
# Match the upstream contract-ledger template: tasks, owners, owned paths,
# runnable completion checks, status updates, and same-commit check-ins.
#
# 1. No work without a task. Use only the named task's owns paths.
# 2. Check OUT (status, owner, started_at) before each task; check IN
#    (status: done, real one-line result) in the same commit as its work.
# 3. Run definition_of_done and record actual output; no unverified "done".
# 4. Tests and task-specific documentation ship WITH each implementation task.
# 5. H-09 and H-10 intentionally appear before H-04: their independent
#    work must finish before the API/backend gate. Execute in LIST ORDER,
#    not numeric ID order. H-02/H-03 and H-09/H-10 may run in parallel
#    for different people, with no overlapping owned paths.
# 6. HARD GATE: H-05 frontend starts only after H-04's backend checks pass.
# 7. SPEC is finalized by the team. Never silently change its methods,
#    datasets, policy thresholds or actions; ask if a contradiction blocks code.
# 8. Keep credentials out of committed files. No extra features.
# YAML check: python -c "import yaml; yaml.safe_load(open('CONTRACT.yaml'))"

spec: SPEC.md
updated: "2026-10-17"

