# Execution ledger for the two-hour bike-sharing MVP.
# Product scope: SPEC.md. Architecture/decision agreement: CONTRACT.md.
# Read both before running any task; CONTRACT.yaml is the source of truth for
# task status, named owners, file ownership, and runnable acceptance checks.
#
# WORKFLOW:
# - No new feature without changing SPEC.md + CONTRACT.md first.
# - One in_progress task per developer/agent. H-01 and H-02 may run in parallel,
#   as may H-03 and H-04. H-10 may run while H-09 deploys.
# - Check out by setting status, owner, started_at.
# - Write ONLY to owns paths. Changes to shared interfaces require team approval.
# - Each implementation task includes its tests and documentation in the SAME
#   work unit/commit. Never save all documentation for the final hour.
# - Run definition_of_done, quote the real output, then check in with result.
# - Never mark done based on an expected result, or commit/push without approval.
# - HARD GATE: H-07 FRONTEND cannot start until H-06 BACKEND GATE passes.
# - Each `owns` list is disjoint; editing this ledger is allowed for check-in.

spec: SPEC.md
architecture_contract: CONTRACT.md
