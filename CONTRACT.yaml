# CONTRACT.yaml - the task ledger for your hackathon project.
# SPEC.md says what the tool IS. This file says what is being DONE.
# These eight tasks cover the hackathon rubric (docs/criteria.md).
# Architecture and sequence live in docs/plan.md, NOT in this ledger.
#
# How to use it (humans and agents alike; see contract-ledger skill):
#   1. Nothing gets built unless covered by a task here. Add a new task
#      (H-09, H-10, ...) with teammate approval if truly needed.
#   2. One in_progress task per person or agent at a time.
#   3. Check OUT: status: in_progress, owner, started_at.
#   4. Check IN: status: done + actual test result in the SAME commit as work.
#   5. Run each definition_of_done exactly and paste its output.
#   6. Write only in the task's owns paths.
#   7. Quote strings containing a colon. No tabs.
#   8. Write tests and documentation AS YOU BUILD each task; H-07 audits them.
#   9. H-05 frontend work starts ONLY after the H-04 backend gate passes.
# Check format: python -c "import yaml; yaml.safe_load(open('CONTRACT.yaml'))"

