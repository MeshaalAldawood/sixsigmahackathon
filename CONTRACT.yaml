    points: "25 - Tool Implementation: valid quality-control statistics in Python"
    status: todo
    owner: ""
    started_at: ""
    owns: ["app/qc.py", "app/requirements.txt", "tests/test_qc.py", "docs/statistics.md"]
    notes: >
      Load stats-first-steering first. Implement the one tested p-chart
      statistic with exact binomial tail limits alpha=0.00135 and
      Western Electric rule 1 only; never substitute normal 3-sigma limits.
      Core arithmetic must accept a four-day hand-calculation fixture
      independent of the application's minimum-ten-baseline-day gate.
      Check availability: baseline d=2,4,3,3 with n=24 each =>
      p_bar=.125, n24 upper count 9/UCL=.375, n20 upper count 8/UCL=.40,
      d10 high, d8 not high; lower count 0. Maintenance: 10/100 =>
      upper count 20/UCL=.20, lower count 2/LCL=.02; d25 high,
      d20 not; d<=1 below lower limit. Test p_bar=0/1, n=0,
      insufficient baseline at report level, missing inputs and varying n.
      Use scipy.stats.binom.sf/cdf as source of exact tails and pin dependencies.
      Write docs/statistics.md now, including correlation/exploratory warning.
    definition_of_done: >
      python -m pytest tests/test_qc.py -q &&
      test -f docs/statistics.md; numeric assertions reproduce every
      SPEC section-4 hand answer including changed-n limits,
      boundary equality, lower flags and invalid cases.
    result: ""

  - id: H-09
    title: Availability AM/PM decision module and tests
    points: "25 - Working-tool implementation (availability portion)"
    status: todo
    owner: ""
    started_at: ""
    owns: ["app/availability.py", "tests/test_availability.py", "docs/availability.md"]
    notes: >
      Separate station p-charts for AM and PM; subgroup is station x weekday
      x rush window, d=count of unusable snapshots, n=count actually logged.
      Unusable = bikes_available==0 OR docks_available==0. Empty and full
      counts remain distinct. Baseline is first 10 weekdays; target=.10
      is an SLA target, NOT a statistical control limit. Compute median first
      empty/full clock times over baseline affected days with numerator/
      denominator wording, e.g. "07:40 on 3 of 10 days". Follow EXACT
      first-match action precedence from SPEC: full with disabled bikes =>
      collect first; high special-cause flag => investigate PLUS van direction;
      in-control but p_bar > .10 => capacity review; then empty>full drop
      or full>empty pull BEFORE typical onset time; otherwise OK.
      Actionable rows first; tie station_id; show both windows and latest-day
      table. Missing snapshot reduces n; n=0 gets no limits/warning.
      Must not import maintenance module. Document rules as this is built.
    definition_of_done: >
      python -m pytest tests/test_availability.py -q &&
      test -f docs/availability.md; tests cover AM/PM separation,
      exact control limits, actions/precedence, missing snapshots,
      chronic target vs special-cause signal, median time and ties.
